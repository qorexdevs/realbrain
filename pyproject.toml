[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "realbrain"
version = "0.1.1"
description = "Local operating-memory layer for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "RealBrain Contributors" }]
dependencies = ["pydantic>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
